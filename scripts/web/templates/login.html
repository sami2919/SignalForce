{% extends "base.html" %}
{% block title %}Sign in — SignalForce{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="badge-warn">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <label for="code">Invite code</label><br>
  <input id="code" name="code" type="password" autocomplete="off" required style="min-width:22rem">
  <button type="submit">Sign in</button>
</form>
{% endblock %}
