# Opening evidence is one fact per venue (venue about to open): only the strongest of these
# signals counts toward p_window; the rest stay in the trace at contribution 0.
opening_evidence_signals: [license_pending, license_issued, not_yet_inspected, opening_soon, hiring_burst]
# At most this many venues' opening terms enter a group's p_window (strongest first), so a
# group with dozens of licenses cannot saturate on license count alone.
max_opening_venues_per_group: 3
max_people_signals_per_group: 2   # strongest people-family signals counted per group
# Contract / institutional food-service operators and non-restaurant premises are not Magic's
# buyer. Case-insensitive regexes over normalized (lowercase, no punctuation or corp suffix)
# group, venue and licensee names. Kept narrow: anchored on operator names, never bare words.
disqualify_reason: contract_foodservice
disqualify_name_patterns:
  - '\baramark\b'
  - '^otg (management|jfk|lga|ewr|venture)'
  - '^ssp america\b'
  - '\bhmshost\b'
  - '^host international\b'
  - '^compass group\b'
  - '\bsodexo\b'
  - '^delaware north\b'
  - '^levy (premium|restaurants?|food)'
  - '^restaurant associates\b'
  - '\bcenterplate\b'
  - '\bbon appetit management\b'
  - '^legends hospitality\b'
  - '\bcai foods\b'                       # amusement-park concessions (Luna Park)
  - '\bcentral amusement international\b'
  - '\bconcessions?\b'                   # stadium / arena / venue concession operators
  - '\b(sky|admirals|centurion) club\b'  # airline lounges
  - '\bairline lounge\b'
# Non-restaurant premises, from the data rather than names. A venue is non-restaurant when its
# zip code is listed (JFK and LaGuardia airport property: terminal concessions run by
# concessionaire JVs), or when EVERY one of its licenses has a listed SLA description (a
# Catering Establishment license only: banquet halls, event spaces). A group is disqualified only
# when every venue is non-restaurant, and a venue with no premises evidence never is. Hotel and
# Food & Beverage Business classes are NOT listed: hotel restaurants and bars can be Loyalist's
# buyer (Hotel Chelsea is a customer).
non_restaurant_premises:
  zip_codes: {"11430": airport, "11371": airport}
  license_descriptions: {Catering Establishment: catering_establishment}
# Non-buyers the data cannot express, by reason (checked in order; the first match wins).
# Case-insensitive regexes over normalized group / venue / licensee names, kept narrow: a
# restaurant with a catering arm ("... Restaurant & Catering LLC") or a namesake ("The Museum
# Bar", "Bar Society") must not match.
non_restaurant_name_patterns:
  institution: ['\bzoo\b', '\baquarium\b', '\bwildlife conservation society\b']
  caterer: ['\bcaterers?\b']
  hotel_chain:
    - '^marriott (resorts|international|hotels?|vacations?)\b'
    - '\bhilton (management|worldwide|garden inn|hotels?)\b'
    - '\bhyatt (equities|corporation|hotels?)\b'
# People who previously worked at these employers produce an alumni_edge (warm-intro) signal.
alumni_employers:
  - Eleven Madison Park
  - Make It Nice
  - Union Square Hospitality Group
  - Major Food Group
  - Momofuku
  - The Corner Store
  - Thomas Keller Restaurant Group
# Culinary Agents (culinaryagents.com) job-board source. DISABLED by default: its user agreement
# appears to restrict automated collection, so review https://culinaryagents.com/agreement and
# set enabled: true yourself. Only robots-allowed public employer-side pages are fetched, the page
# budget is budgets.culinary_agents, and nothing under /users is ever requested.
culinary_agents:
  enabled: false
  # Logged-in mode: your own session cookie in CULINARY_AGENTS_COOKIE (never in this file).
  # The agreement (section 7) bans robots and scrapers without written permission and limits
  # accounts to personal use: turning this on accepts a banned account or a legal letter.
  # Keep it false here; turn it on locally. Daily run budget: budgets.culinary_agents;
  # `--backfill` budget: budgets.culinary_agents_backfill.
  authenticated: false
  max_pages_per_search: 50
  daily_stop_after_known: 15     # consecutive already-seen organic items before a daily run stops
  segment_ids: ["13", "9", "2", "1"]   # captured defaults; confirm the labels on the first run
  profile_refresh_days: 30
  max_articles: 10               # public /resources articles per `culinary-agents --articles` run
  locations: ["New York, NY"]   # 3 pages each; other strings (e.g. "Brooklyn, NY") are untested
  delay_seconds: 2.0
  max_company_pages: 10
  # Title regexes over the folded, lowercased title, one list per signal type, checked in this
  # order (first match wins). Line-level roles (cook, server, runner, dishwasher, porter,
  # polisher, barback) emit nothing on their own; they count only toward hiring_burst.
  chef_titles:      # new_chef
    - '\b(executive|head|corporate|opening) chef\b'
    - '\bchef de cuisine\b'
    - '\bculinary director\b'
    - '\bdirector of culinary\b'
  gm_titles: ['\bgeneral manager\b', '^gm$', '\bopening gm\b', '\bdirector of operations\b']   # new_gm
  events_titles:    # events_role_hire
    - '\b(events?|private dining|private events?|catering) (sales )?(manager|director|coordinator|sales)\b'
    - '\bdirector of (private )?(events?|dining|catering)\b'
  guest_titles:     # guest_role_hire: owns the guest list and bookings
    - '\bguest (relations|experience) (manager|director)\b'
    - '\bguest relations coordinator\b'
    - '\b(dining room|restaurant) manager\b'
    - '\breservations? (manager|director|supervisor)\b'
    - '\breservationists?\b'
    - '\bmaitre d\b'
    - '\bhost manager\b'
    - '\bdirector of (sales|partnerships)\b'
    - '\b(marketing (manager|director)|director of marketing)\b'
    - '\bcrm\b'
    - '\bloyalty\b'
    - '\bguest data\b'
  leadership_titles:   # role_hire: the senior titles left over
    - '\bdirector of (hospitality|food (and|&) beverage)\b'
    - '\b(pre-?opening|opening) (team|manager)\b'
  exclude_title_words: [assistant, associate, intern, trainee]
  # fine_dining_service fit criterion (not a window signal); exclude_title_words does not apply.
  service_titles: ['\bsommeliers?\b', '\b(wine|beverage) director\b', '\bdirector of (wine|beverage)\b', '\bcaptains?\b', '\bservice manager\b', '\bpastry chef\b']
  open_call_titles: ['\bopen call\b']   # an "Open Call" posting is a hiring_burst
  burst_min_roles: 5      # or this many distinct roles from one employer ...
  burst_window_days: 30   # ... within this many days
