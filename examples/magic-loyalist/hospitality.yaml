datasets: {sla_pending: f8i8-k2gm, sla_active: 9s3h-dpkz, sla_inactive: 6dg3-2z7i, dohmh: 43nn-pn8j}
nyc_counties: [New York, Kings, Queens, Bronx, Richmond]
on_premise_descriptions: [Restaurant, Food & Beverage Business, Hotel, Catering Establishment, Summer Restaurant]
priors:   # precision = P(group in a buying window | signal); starting guesses the loop updates
  license_pending:   {precision: 0.30, half_life_days: null, family: opening}
  license_issued:    {precision: 0.30, half_life_days: null, family: opening}
  not_yet_inspected: {precision: 0.15, half_life_days: null, family: opening}
  press_opening:     {precision: 0.35, half_life_days: null, family: opening}
  stack_fragmented:  {precision: 0.25, half_life_days: null, family: stack}
  tripleseat_resy:   {precision: 0.25, half_life_days: null, family: stack}
  private_events:    {precision: 0.15, half_life_days: 120, family: events}
  hotel_partnership: {precision: 0.20, half_life_days: 180, family: opening}
  role_hire:         {precision: 0.15, half_life_days: 90, family: people}
  new_gm:            {precision: 0.15, half_life_days: 90, family: people}
  platform_switch:   {precision: 0.05, half_life_days: 90, family: stack}
  opening_soon:      {precision: 0.30, half_life_days: null, family: opening}
  lookalike:         {precision: 0.10, half_life_days: null, family: discovery}
  alumni_edge:       {precision: 0.0, half_life_days: null, family: relationship}
window_pre_days: 183
window_post_days: 365
window_outside_half_life_days: 60
pending_to_issue_prior_days: 75
# An issued license with no DOHMH record (not even one awaiting inspection) older than this is
# treated as a match miss, not a still-unopened venue: censored out of the opening curve and
# given no window estimate. ~ the observed-duration p25 (94d); the curve median is flat (282-292d)
# for caps 0-120d (measured on the NYC store when the rule was set; re-check after a re-ingest).
window_unmatched_censor_max_age_days: 90
# Issue-to-first-inspection durations longer than this are not counted as openings by the curve
# (live: 95% of observed openings inspect within ~690 days of issue). A venue still uninspected
# past the same age is stale, so it emits no not_yet_inspected signal.
max_opening_days: 730
not_yet_inspected_max_age_days: 730
# license_issued fires only for licenses issued within this many days of the scoring date.
issued_lookback_days: 365
# Recall audit: a signal more than this many days before the first inspection still counts as
# caught, but is not a buying-window lead, so it is kept out of the reported median lead.
recall_lead_cap_days: 365
# Event ranking. Priors are starting assumptions, not measured.
events:
  attend_prior:   # role -> P(attends)
    speaker: 0.95
    panelist: 0.95
    festival_chef: 0.95
    award_nominee: 0.9
    exhibitor_staff: 0.7
    sponsor: 0.6
    past_recap: 0.35
  meeting_rate_prior:   # event type -> P(qualified meeting | attends)
    curated_conference: 0.15
    festival: 0.08
    awards: 0.05
    trade_show: 0.03
    local_meetup: 0.20
    magic_dinner: 0.50
  unmatched_priority: 0.05
  # "In window" = p_window at or above this. 0.30 is one full-weight license signal inside its
  # estimated opening window (the license priors are 0.30). Live, 0.5 was reached by one group
  # of 1,348, so every other target printed "not in window".
  in_window_p: 0.30
# Head-to-head vs plain Claude (each run: at most max_searches web searches).
benchmark:
  runs: 3
  max_searches: 20
  k: 50
  web_search_usd_each: 0.01
# A draft passes the judge at or above this rubric score, and only with no grounding violation.
judge_pass_score: 7.0
# Hunter emails are used only at or above this confidence (0-100).
min_email_confidence: 70.0
# Paid-spend caps per prospect group: Hunter email lookups (best roles first) and drafted angles
# (each is one Claude draft call plus one judge call).
max_email_lookups_per_group: 2
draft_angles_per_group: 3
# The demo report's recall audit looks back this many weeks (`recall --weeks` for others).
report_recall_weeks: 12
# Google Places: accept the nearest candidate within this distance and at least this name match.
website_match_max_distance_m: 75.0
website_match_min_name_similarity: 0.6
fit_weights: {multi_venue: 0.30, reservation_platform: 0.30, events_program: 0.15, accolade: 0.15, full_service_class: 0.10}
relationship_boost: 0.5
budgets: {culinary_agents: 40, places: 400, firecrawl: 300, exa: 120, hunter: 40, clay: 25, claude_calls: 600}
models: {extract: claude-opus-5-5, draft: claude-opus-5-5, judge: claude-opus-5-5, baseline: claude-opus-5-5}
match_max_distance_m: 40.0
match_auto_threshold: 0.90
match_link_threshold: 0.60
# A website on one of these shared hosts says nothing about common ownership, so it never merges
# venues into one group by shared domain (registrable domain, lowercase).
shared_host_domains: [instagram.com, facebook.com, tiktok.com, twitter.com, x.com, linktr.ee,
  linkin.bio, beacons.ai, carrd.co, google.com, business.site, yelp.com, resy.com, opentable.com,
  exploretock.com, sevenrooms.com, toasttab.com, squareup.com, square.site, clover.com,
  wixsite.com, squarespace.com, godaddysites.com, weebly.com, wordpress.com, blogspot.com,
  webflow.io, menufy.com, chownow.com, slicelife.com, grubhub.com, seamless.com, doordash.com,
  ubereats.com, bit.ly]
# A website lookup that found nothing is retried after this many days (unopened venues often have
# no listing yet). A found website is never looked up (or billed) again.
website_miss_retry_days: 60
# Groups with a Michelin / James Beard accolade, by group_id or name (manual for the demo).
accolades: []
# Opening evidence is one fact per venue (venue about to open): only the strongest of these
# signals counts toward p_window; the rest stay in the trace at contribution 0.
opening_evidence_signals: [license_pending, license_issued, not_yet_inspected, opening_soon]
# At most this many venues' opening terms enter a group's p_window (strongest first), so a
# group with dozens of licenses cannot saturate on license count alone.
max_opening_venues_per_group: 3
# Contract / institutional food-service operators and non-restaurant premises are not Magic's
# buyer. Case-insensitive regexes over normalized (lowercase, no punctuation or corp suffix)
# group, venue and licensee names. Kept narrow: anchored on operator names, never bare words.
disqualify_reason: contract_foodservice
disqualify_name_patterns:
  - '\baramark\b'
  - '^otg (management|jfk|lga|ewr|venture)'
  - '^ssp america\b'
  - '\bhmshost\b'
  - '^host international\b'
  - '^compass group\b'
  - '\bsodexo\b'
  - '^delaware north\b'
  - '^levy (premium|restaurants?|food)'
  - '^restaurant associates\b'
  - '\bcenterplate\b'
  - '\bbon appetit management\b'
  - '^legends hospitality\b'
  - '\bcai foods\b'                       # amusement-park concessions (Luna Park)
  - '\bcentral amusement international\b'
  - '\bconcessions?\b'                   # stadium / arena / venue concession operators
  - '\b(sky|admirals|centurion) club\b'  # airline lounges
  - '\bairline lounge\b'
# Non-restaurant premises, from the data rather than names. A venue is non-restaurant when its
# zip code is listed (JFK and LaGuardia airport property: terminal concessions run by
# concessionaire JVs), or when EVERY one of its licenses has a listed SLA description (a
# Catering Establishment license only: banquet halls, event spaces). A group is disqualified only
# when every venue is non-restaurant, and a venue with no premises evidence never is. Hotel and
# Food & Beverage Business classes are NOT listed: hotel restaurants and bars can be Loyalist's
# buyer (Hotel Chelsea is a customer).
non_restaurant_premises:
  zip_codes: {"11430": airport, "11371": airport}
  license_descriptions: {Catering Establishment: catering_establishment}
# Non-buyers the data cannot express, by reason (checked in order; the first match wins).
# Case-insensitive regexes over normalized group / venue / licensee names, kept narrow: a
# restaurant with a catering arm ("... Restaurant & Catering LLC") or a namesake ("The Museum
# Bar", "Bar Society") must not match.
non_restaurant_name_patterns:
  institution: ['\bzoo\b', '\baquarium\b', '\bwildlife conservation society\b']
  caterer: ['\bcaterers?\b']
  hotel_chain:
    - '^marriott (resorts|international|hotels?|vacations?)\b'
    - '\bhilton (management|worldwide|garden inn|hotels?)\b'
    - '\bhyatt (equities|corporation|hotels?)\b'
# People who previously worked at these employers produce an alumni_edge (warm-intro) signal.
alumni_employers:
  - Eleven Madison Park
  - Make It Nice
  - Union Square Hospitality Group
  - Major Food Group
  - Momofuku
  - The Corner Store
  - Thomas Keller Restaurant Group
# Culinary Agents (culinaryagents.com) job-board source. DISABLED by default: its user agreement
# appears to restrict automated collection, so review https://culinaryagents.com/agreement and
# set enabled: true yourself. Only robots-allowed public employer-side pages are fetched, the page
# budget is budgets.culinary_agents, and nothing under /users is ever requested.
culinary_agents:
  enabled: false
  locations: ["New York, NY"]   # 3 pages each; other strings (e.g. "Brooklyn, NY") are untested
  delay_seconds: 2.0
  max_company_pages: 10
  # Senior roles only (regex over the lowercased title); cooks, servers, dishwashers emit nothing.
  gm_titles: ['\bgeneral manager\b', '^gm$']
  leadership_titles:
    - '\bdirector of (operations|hospitality|food (and|&) beverage)\b'
    - '\b(events?|private dining|private events?|catering) (manager|director|coordinator)\b'
    - '\b(pre-?opening|opening) (team|manager|gm|general manager)\b'
    - '\bmaitre d\b'
    - '\bguest (relations|experience) manager\b'
    - '\breservations? manager\b'
  exclude_title_words: [assistant, associate, intern, trainee]
