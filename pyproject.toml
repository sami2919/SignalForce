[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalforce"
version = "0.1.0"
description = "Signal-based outbound sales engine — configure for any ICP"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "beautifulsoup4>=4.12",
    "pydantic>=2",
    "pydantic-settings>=2",
    "PyYAML>=6",
    "python-dotenv",
    "sqlalchemy>=1.4",
    "anthropic>=0.50.0",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "selectolax>=0.3",
    "svix>=1.24",
]

[tool.setuptools.packages.find]
include = ["scripts", "scripts.*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scripts --cov-report=term-missing"
# Known-broken, unrelated to config/.env isolation (Task 0.3a) — see
# .superpowers/sdd/2026-08-04-signalforce-production/task-0.3a-report.md.
# scripts/fireworks_client.py was never committed on this branch, so
# scripts/demo_fireworks_icp.py fails to import it. Tracked debt, not
# deleted assertions. CI (Task 0.3b) should pass these as --deselect:
#   --deselect tests/test_fireworks_icp_config.py::test_demo_script_loaders
#   --deselect tests/test_fireworks_icp_config.py::test_demo_script_build_prompt

[tool.coverage.run]
# Demo/one-off scripts, deliberately excluded from the production coverage gate.
# Neither is imported by the web app or the scan worker — they exist to generate
# artifacts by hand, so measuring them would make the gate a statement about
# throwaway code rather than about the deployed system.
#
# NOT a dumping ground: every entry needs a reason on the line above it, and
# anything under scripts/scanners/ stays measured. g2_seed_scanner.py sits at
# 0% and is deliberately left IN so its missing tests remain visible debt.
# Decision D10, 2026-08-04.
omit = [
    # One-off PDF generator for the demo deck. 267 statements, run by hand.
    "scripts/generate_demo_pdf.py",
    # Fireworks demo script; imports scripts.fireworks_client, which was never
    # committed on any branch. Dead on this branch by definition.
    "scripts/demo_fireworks_icp.py",
]
